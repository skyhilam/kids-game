<script>
'use strict';
(() => {
  // A road is an UNDIRECTED edge. Once used in either direction, it is unavailable.
  // These original, enlarged maps adapt the photographed activity's rules for toddlers.
  const LEVELS = [
    {name:'跟住小路走', nodes:{s:[135,155],a:[135,345],h:[435,345],b:[685,345],p:[685,545]}, edges:[['s','a'],['a','h'],['h','b'],['b','p']]},
    {name:'記得買漢堡', nodes:{s:[135,155],a:[135,345],h:[435,345],b:[685,345],p:[685,545],c:[135,545],d:[435,545]}, edges:[['s','a'],['a','h'],['h','b'],['b','p'],['a','c'],['c','d'],['d','p']]},
    {name:'小小探路家', nodes:{s:[135,155],a:[135,345],h:[435,345],b:[685,345],p:[685,545],c:[135,545],d:[435,545],u:[685,155],v:[540,155]}, edges:[['s','a'],['a','h'],['h','b'],['b','p'],['a','c'],['c','d'],['d','h'],['d','p'],['b','u'],['u','v']]}
  ];
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = {level:0, node:'s', burger:false, used:new Set(), moving:false, started:false, sound:true, won:false, stalled:false, epoch:0, completed:new Set(), angle:90};
  let MAP_W = 840, MAP_H = 660, narrowLayout = false, layoutTimer = 0;
  let graph = null, audio = null, voice = null, toastTimer = 0, pickupTimer = 0, announcementTimer = 0, modalKind = '', returnFocus = null, pointerStart = null;
  const svg = (id, cls='') => `<svg ${cls ? `class="${cls}"` : ''} aria-hidden="true"><use href="#${id}"/></svg>`;
  const svgUse = (id,x,y,w,h,extra='') => `<use href="#${id}" x="${x}" y="${y}" width="${w}" height="${h}" ${extra}/>`;
  const roadKey = (a,b) => [a,b].sort().join('-');
  const clamp = (v,min,max) => Math.max(min,Math.min(max,v));

  function makeGraph(index) {
    const source = LEVELS[index];
    const level = {...source, nodes:Object.fromEntries(Object.entries(source.nodes).map(([id,[x,y]])=>[id,narrowLayout ? [x/840*600, 150+(y-155)*1.22] : [x,y]]))};
    const edges = level.edges.map(([a,b],i) => ({id:roadKey(a,b),a,b,index:i,points:[level.nodes[a],level.nodes[b]]}));
    const adj = {};
    Object.keys(level.nodes).forEach(n => adj[n] = []);
    edges.forEach(e => {adj[e.a].push({edge:e,to:e.b}); adj[e.b].push({edge:e,to:e.a});});
    return {...level, edges, adj};
  }
  function available() {return graph.adj[state.node].filter(x => !state.used.has(x.edge.id));}

  // Exhaustive search over this small graph. It never recommends a reused road,
  // and reaching the park without a burger is not a solution.
  function findSolution(node=state.node, burger=state.burger, used=state.used) {
    const failed = new Set();
    const search = (n,hasBurger,mask) => {
      if(n==='p') return hasBurger ? [] : null;
      const key = `${n}/${hasBurger ? 1 : 0}/${mask}`;
      if(failed.has(key)) return null;
      for(const link of graph.adj[n]) {
        const bit = 1 << link.edge.index;
        if(mask & bit) continue;
        const result = search(link.to,hasBurger || link.to==='h',mask | bit);
        if(result !== null) return [link.to,...result];
      }
      failed.add(key); return null;
    };
    let mask=0;
    graph.edges.forEach(e => {if(used.has(e.id)) mask |= 1 << e.index;});
    return search(node,burger,mask);
  }

  function loadVoices() {
    try {
      const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
      // Never substitute Mandarin or an English voice for Cantonese copy.
      voice = voices.find(v => /^(zh[-_]HK|yue)([-_]|$)/i.test(v.lang)) || voices.find(v => /cantonese|廣東話|粤语|粵語/i.test(v.name)) || null;
    } catch (_) {voice=null;}
  }
  loadVoices();
  if(window.speechSynthesis && speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', loadVoices);
  function initAudio() {
    if(!state.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!audio && AC) audio = new AC();
      if(audio && audio.state==='suspended') audio.resume().catch(()=>{});
    } catch (_) {audio=null;}
  }
  function playNotes(notes) {
    if(!state.sound) return;
    initAudio();
    if(!audio) return;
    try {
      notes.forEach(([hz,offset,length,volume=.07]) => {
        const now=audio.currentTime+offset, osc=audio.createOscillator(), gain=audio.createGain();
        osc.type='sine'; osc.frequency.value=hz;
        gain.gain.setValueAtTime(0,now); gain.gain.linearRampToValueAtTime(volume,now+.016); gain.gain.exponentialRampToValueAtTime(.001,now+length);
        osc.connect(gain); gain.connect(audio.destination); osc.start(now); osc.stop(now+length+.04);
        osc.onended=()=>{osc.disconnect();gain.disconnect();};
      });
    } catch (_) {/* Sound is optional; gameplay must remain available. */}
  }
  function speak(text) {
    if(!state.sound || !window.speechSynthesis) return;
    try {
      loadVoices(); if(!voice) return;
      speechSynthesis.cancel();
      const message = new SpeechSynthesisUtterance(text);
      message.voice=voice; message.lang=voice.lang; message.rate=.83; message.pitch=1.08; message.volume=.85;
      speechSynthesis.speak(message);
    } catch (_) {}
  }
  function cancelSpeech() {try {if(window.speechSynthesis) speechSynthesis.cancel();} catch (_) {}}
  function setGuide(main,sub,read=false) {
    $('guideMain').textContent=main;
    if(sub!==undefined) $('guideSub').textContent=sub;
    if(read) speak(main);
  }
  function toast(text) {
    clearTimeout(toastTimer); $('toast').textContent=text; $('toast').hidden=false;
    toastTimer=setTimeout(()=>$('toast').hidden=true,2600);
  }

  function renderScenery() {
    $('baseScenery').setAttribute('transform',`scale(${MAP_W/840} ${MAP_H/660})`);
    $('backDecor').setAttribute('transform',`scale(${MAP_W/840} ${MAP_H/660})`);
    $('backDecor').innerHTML = `
      <path d="M840 501q-79-22-105 13t-37 80q-20 33 50 66h92Z" fill="#b7d7d1"/>
      <path d="M840 514q-73-25-91 17t-33 64" fill="none" stroke="#cfe5d7" stroke-width="5"/>
      <path d="M767 553h25m-40 30h22m22 28h19" stroke="#e6f1df" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(766 73)"><g stroke="#e1c26a" stroke-width="2.6" stroke-linecap="round"><path d="M0-34v-7M0 34v7M-34 0h-7M34 0h7M-24-24l-5-5M24-24l5-5M24 24l5 5M-24 24l-5 5"/></g><circle r="25" fill="#f2d889"/><circle cx="-7" cy="-1" r="2" fill="#a79964"/><circle cx="7" cy="-1" r="2" fill="#a79964"/><path d="M-5 7q5 5 10 0" fill="none" stroke="#b5a368" stroke-width="2" stroke-linecap="round"/></g>
      <g fill="#f8faed" opacity=".85"><path d="M242 65c-5-24 28-31 39-11 25-17 39 3 32 17h-66q-9 0-5-6Z"/><path d="M488 74c-2-13 16-23 25-9 21-12 31 4 25 11h-44q-9 0-6-2Z"/></g>
      ${svgUse('art-tree',20,188,76,97)}
      ${svgUse('art-tree',748,309,80,108)}
      ${svgUse('art-tree',21,544,66,88)}
      ${svgUse('art-flower',265,238,29,35,'class="flower"')}
      ${svgUse('art-flower',330,574,30,36,'class="flower"')}
      ${svgUse('art-flower',533,437,28,34,'class="flower"')}
      <g fill="#b5c98c"><ellipse cx="65" cy="436" rx="18" ry="10"/><ellipse cx="82" cy="432" rx="16" ry="13"/><ellipse cx="98" cy="438" rx="14" ry="8"/></g>
      <path d="M248 444q10-10 20 0m7 0q10-10 20 0" stroke="#9eb886" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g transform="translate(595 81) rotate(-8)"><path d="M-11 0q5-8 11 0 5-8 11 0" fill="none" stroke="#9caf9b" stroke-width="2.3" stroke-linecap="round"/></g>`;
    if(narrowLayout) {
      // Preserve the proportions of trees, flowers and the sun on a tall phone map.
      $('backDecor').querySelectorAll('use').forEach(el=>{
        const x=Number(el.getAttribute('x')),y=Number(el.getAttribute('y'));

  $('restartBtn').addEventListener('click',()=>{
    if(state.moving || $('gameDialog').open) return;
    cancelSpeech();playNotes([[523,0,.18]]);startLevel(state.level,{announce:true});
  });
  $('gameDialog').addEventListener('cancel',event=>{
    // Keep the welcome and result cards explicit for small children.
    if(modalKind==='help' || modalKind==='rescue') {event.preventDefault();closeDialog();}
    else event.preventDefault();
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Tab') document.documentElement.dataset.keyboard='true';
    if($('gameDialog').open || isBlocked()) return;
    const dirs={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]};
    if(dirs[event.key]) {
      event.preventDefault();document.documentElement.dataset.keyboard='true';
      const [vx,vy]=dirs[event.key],[x,y]=graph.nodes[state.node];
      const choice=available().map(l=>{const [nx,ny]=graph.nodes[l.to],dx=nx-x,dy=ny-y;return {to:l.to,score:(dx*vx+dy*vy)/Math.hypot(dx,dy)};}).sort((a,b)=>b.score-a.score)[0];
      if(choice && choice.score>.7) move(choice.to);
    }
  });
  document.addEventListener('pointerdown',()=>{document.documentElement.dataset.keyboard='false';},{passive:true});
  // A forgiving optional swipe: it must start close to the car, then head toward
  // one adjacent unused road. It can never skip junctions or cross the grass.
  $('board').addEventListener('pointerdown',event=>{
    if(event.target.closest('button') || isBlocked()) return;
    const rect=$('board').getBoundingClientRect();
    const x=(event.clientX-rect.left)/rect.width*MAP_W,y=(event.clientY-rect.top)/rect.height*MAP_H;
    const [cx,cy]=graph.nodes[state.node];
    if(Math.hypot(x-cx,y-cy)<Math.max(60,38/rect.width*MAP_W)) {
      pointerStart={id:event.pointerId,x:event.clientX,y:event.clientY};
      $('board').setPointerCapture(event.pointerId);
    } else {
      // Large road area is also clickable; nearest legal target within 45 CSS px.
      const nearest=available().map(l=>{const [nx,ny]=graph.nodes[l.to];return {to:l.to,d:Math.hypot((nx-x)*rect.width/MAP_W,(ny-y)*rect.height/MAP_H)};}).sort((a,b)=>a.d-b.d)[0];
      if(nearest && nearest.d<45) move(nearest.to);
    }
  });
  $('board').addEventListener('pointerup',event=>{
    if(!pointerStart || pointerStart.id!==event.pointerId) return;
    const dx=event.clientX-pointerStart.x,dy=event.clientY-pointerStart.y;pointerStart=null;
    if(isBlocked() || Math.hypot(dx,dy)<20) return;
    const [x,y]=graph.nodes[state.node];
    const best=available().map(l=>{const [nx,ny]=graph.nodes[l.to],vx=nx-x,vy=ny-y;return {to:l.to,score:(dx*vx+dy*vy)/(Math.hypot(dx,dy)*Math.hypot(vx,vy))};}).sort((a,b)=>b.score-a.score)[0];
    if(best && best.score>.68) move(best.to);
  });
  $('board').addEventListener('pointercancel',()=>pointerStart=null);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelSpeech();if(audio)audio.suspend().catch(()=>{});}else if(state.started && state.sound && audio){audio.resume().catch(()=>{});}});
  window.addEventListener('pagehide',()=>{cancelSpeech();if(audio)audio.suspend().catch(()=>{});});
  function applyLayout(force=false) {
    const narrow=window.innerWidth<=600;
    if(!force && narrow===narrowLayout) return;
    if(state.moving) {clearTimeout(layoutTimer);layoutTimer=setTimeout(()=>applyLayout(force),120);return;}
    narrowLayout=narrow;MAP_W=narrow?600:840;MAP_H=narrow?790:660;
    $('map').setAttribute('viewBox',`0 0 ${MAP_W} ${MAP_H}`);
    $('board').style.aspectRatio=`${MAP_W} / ${MAP_H}`;
    if(!graph) return;
    graph=makeGraph(state.level);renderScenery();renderRoads();$('trails').replaceChildren();
    state.used.forEach(id=>{
      const e=graph.edges.find(e=>e.id===id);
      if(!e) return;
      const d=`M${e.points.map(p=>p.join(',')).join(' L')}`;
      ['road-used','road-used-inner'].forEach(cls=>{
        const path=document.createElementNS(NS,'path');path.setAttribute('d',d);path.setAttribute('class',cls);
        if(cls==='road-used') path.dataset.edge=id;
        $('trails').append(path);
      });
    });
    if(state.burger) $('shopMarker').innerHTML='<circle r="18" fill="#e6efda" stroke="#8eac70" stroke-width="2"/><path d="m-8 0 5 5L9-7" fill="none" stroke="#6a9257" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
    $('pickup').hidden=true;setCar(...graph.nodes[state.node],state.angle);renderTargets();updateMission();
  }
  window.addEventListener('resize',()=>applyLayout());
  applyLayout(true);startLevel(0);welcome();
})();
</script>
