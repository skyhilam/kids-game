name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, kids-game]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  static:
    runs-on: [self-hosted, Linux, kids-game]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          classify() {
            local file
            run=false
            while IFS= read -r file; do
              if [ -z "${file}" ]; then
                continue
              fi
              if [[ "${file}" =~ ^\.github/workflows/ ]] || [[ "${file}" =~ ^\.github/actionlint\.yaml$ ]] || [[ "${file}" =~ \.sh$ ]]; then
                run=true
                return 0
              fi
            done <<< "${files}"
          }
          run=true
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            run=true
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ]; then
              run=true
            else
              files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
              classify
            fi
          elif [ "${EVENT_NAME}" = "push" ]; then
            if [ -z "${BEFORE_SHA}" ] || [ -z "${BEFORE_SHA//0/}" ]; then
              run=true
            else
              files="$(git diff --name-only "${BEFORE_SHA}" HEAD)"
              classify
            fi
          else
            run=true
          fi
          echo "static tools run=${run}"
          echo "run=${run}" >> "${GITHUB_OUTPUT:?GITHUB_OUTPUT is required}"

      - name: actionlint and shellcheck
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE must point to the runner tool cache}"

          # actionlint 1.7.12 sha256:
          # https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          # ShellCheck 0.11.0 publishes no checksum file. Digests below were
          # computed from the official release assets:
          # https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          # https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.aarch64.tar.xz
          arch="$(uname -m)"
          case "${arch}" in
            x86_64)
              actionlint_asset="actionlint_1.7.12_linux_amd64.tar.gz"
              actionlint_sha="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
              shellcheck_asset="shellcheck-v0.11.0.linux.x86_64.tar.xz"
              shellcheck_sha="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
              ;;
            aarch64)
              actionlint_asset="actionlint_1.7.12_linux_arm64.tar.gz"
              actionlint_sha="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
              shellcheck_asset="shellcheck-v0.11.0.linux.aarch64.tar.xz"
              shellcheck_sha="12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588"
              ;;
            *)
              echo "unsupported architecture: ${arch}" >&2
              exit 1
              ;;
          esac

          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          fetch() {
            curl -fsSL --retry 3 -o "$2" "$1"
          }
          verify() {
            echo "$2  $1" | sha256sum -c - || exit 1
          }

          actionlint_dir="${RUNNER_TOOL_CACHE}/actionlint/1.7.12/${arch}"
          shellcheck_dir="${RUNNER_TOOL_CACHE}/shellcheck/0.11.0/${arch}"
          mkdir -p "${actionlint_dir}" "${shellcheck_dir}"

          fetch "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${actionlint_asset}" "${work}/${actionlint_asset}"
          verify "${work}/${actionlint_asset}" "${actionlint_sha}"
          tar -xzf "${work}/${actionlint_asset}" -C "${actionlint_dir}" actionlint
          chmod 0755 "${actionlint_dir}/actionlint"

          fetch "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/${shellcheck_asset}" "${work}/${shellcheck_asset}"
          verify "${work}/${shellcheck_asset}" "${shellcheck_sha}"
          tar -xJf "${work}/${shellcheck_asset}" -C "${shellcheck_dir}" --strip-components=1 "shellcheck-v0.11.0/shellcheck"
          chmod 0755 "${shellcheck_dir}/shellcheck"

          SHELLCHECK_BIN="${shellcheck_dir}/shellcheck"
          "${actionlint_dir}/actionlint" -shellcheck "${SHELLCHECK_BIN}"
          git ls-files -z '*.sh' | xargs -0 -r "${SHELLCHECK_BIN}"

  validate:
    name: validate
    if: always()
    needs: [build, static]
    runs-on: [self-hosted, Linux, kids-game]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch job timings
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -o "${RUNNER_TEMP}/jobs.json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100"
      # build and static have no job-level if. static's path gate stays inside
      # the job and still finishes success, so ALLOWED_SKIPPED stays empty.
      - name: Validate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          JOBS_JSON_PATH: ${{ runner.temp }}/jobs.json
        run: node scripts/ci-validate.mjs
